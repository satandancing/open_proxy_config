# Copy to config.yaml and adjust. Do not commit secrets here.

output_dir: ./dist
previous_state_file: ./dist/.state.json

http:
  timeout_seconds: 30
  max_body_bytes: 10485760  # 10 MiB
  rate_limit_per_host_per_minute: 30

validation:
  enabled: true
  mihomo_version: "v1.19.32"
  concurrency: 8
  test_timeout_seconds: 25
  test_url: "https://www.gstatic.com/generate_204"
  skip_openvpn_l3: true  # OpenVPN L3 in CI is slow; syntax-only by default

sources:
  vpngate:
    enabled: true
    api_url: "https://www.vpngate.net/api/iphone/"
    max_nodes: 50
    emit_ovpn_dir: true

  warp:
    enabled: true
    # Credentials: set WARP_PRIVATE_KEY (+ optional WARP_DEVICE_ID, WARP_ACCESS_TOKEN)
    # or let the builder register at runtime (keys written only to output_dir, never committed).
    register_if_missing: true
    endpoint_host: "162.159.123.1"
    endpoint_port: 2408
    client_ipv4: "172.16.0.2"

  aggregator:
    enabled: true
    urls:
      - "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt"
    max_nodes_per_url: 200

merge:
  rules:
    - MATCH,GLOBAL
